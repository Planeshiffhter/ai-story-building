name: Validate all ten episode story packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: episode-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all ten episodes and local links
        run: python tools/check_series.py
      - name: Check Episode 01 regenerated sequential handoff
        run: python Episode_01/sync.py --check
      - name: Run all episode regression tests
        run: python -m unittest discover -s tests -v
